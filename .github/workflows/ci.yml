name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint-typecheck-test:
        name: Lint, Typecheck & Test
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            ESLINT_USE_FLAT_CONFIG: 'false'

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma client
              run: pnpm db:generate

            - name: Verify Prisma schema and migrations
              env:
                  DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
              run: |
                  pnpm --filter @copilotkit/outpost exec prisma validate --schema db/prisma/schema.prisma
                  # Ensure migration directory exists with at least one migration
                  test -f packages/outpost/db/prisma/migrations/migration_lock.toml
                  test -d packages/outpost/db/prisma/migrations/0001_init

            - name: Build
              run: pnpm build

            # Lint skipped: ESLint 9 requires flat config but repo uses legacy .eslintrc.cjs.
            # TODO: Migrate to eslint.config.js and re-enable.

            - name: Typecheck
              run: pnpm typecheck

            - name: Test
              run: pnpm test

    # Deploy each service to Railway once CI is green on main.
    #
    # This replaces Railway's native GitHub auto-deploy (which was staging every
    # deploy behind a manual "Needs approval" click). Because deploy `needs:` the
    # test job and only runs on push to main, a merge to main auto-deploys — but
    # only after "Lint, Typecheck & Test" passes.
    #
    # `railway up` uploads the checked-out repo and builds on Railway using each
    # service's configured Dockerfile / config-as-code path, so the freshly
    # merged commit is what ships — no approval gate.
    #
    # REQUIRED SETUP:
    #   1. Create a Railway **project token** for the production environment and
    #      add it as the `RAILWAY_TOKEN` repository secret (Settings → Secrets →
    #      Actions). A project token is environment-scoped, so no --environment
    #      flag is needed.
    #   2. Disable each service's native "Auto Deploy" in the Railway dashboard
    #      (Service → Settings → Deploy) so a merge doesn't ALSO stage a
    #      GitHub-integration deployment alongside this CLI deploy.
    #
    # Only the four GitHub-connected, currently-online services are deployed.
    # outpost-slack-bot / outpost-teams-bot / outpost-linear-sync are offline
    # (not connected) and are intentionally excluded — add a matrix entry when
    # they're brought online.
    deploy:
        name: Deploy ${{ matrix.service }}
        runs-on: ubuntu-latest
        needs: lint-typecheck-test
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        strategy:
            fail-fast: false
            matrix:
                service:
                    - outpost-web
                    - outpost-worker
                    - outpost-github-app
                    - outpost-discord-bot

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Install Railway CLI
              run: npm i -g @railway/cli@4

            - name: Deploy ${{ matrix.service }} to Railway
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
              run: railway up --service "${{ matrix.service }}" --ci
