name: security / zizmor

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/zizmor.yml"
      - ".github/dependabot.yml"
  # Run on every PR (no paths filter): this check is a required status check on
  # the protected branch, so it must report on all PRs. A paths filter would
  # skip it on PRs that don't touch .github/, leaving the required check stuck
  # "expected" forever and blocking the merge.
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  zizmor:
    name: Static analysis (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          min-severity: medium
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml
