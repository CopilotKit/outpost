# Railway config - outpost-release-bot (scheduled community announcements)
# In Railway: set this service's "Config file path" to apps/release-bot/railway.toml
# and leave Root Directory empty (build context must be the repo root).
#
# This service is a CRON JOB, not a long-running process: it announces whatever is
# new and exits.
#
# cronSchedule is set here rather than in the dashboard so a recreated service is
# still scheduled. Without it, the service runs once at deploy and then never
# again, with no error anywhere to say so.
#
# restartPolicyType = "NEVER" because a completed run exiting 0 is success, not a
# crash. ALWAYS would restart it in a loop, running the job back to back.

# watchPatterns keeps unrelated pushes from redeploying this service. A deploy
# can start a run outside the schedule (Railway's docs do not say either way),
# so without it every merge anywhere in the monorepo could fire an extra run.
#
# Every entry is anchored with a leading slash. These are gitignore-style
# patterns, so an unanchored `package.json` matches all 12 in the repo and an
# unanchored `tsconfig.json` matches all 15 - a Renovate bump on apps/web would
# have redeployed this service, so the list was causing the redeploys it exists
# to prevent.
#
# It narrows the problem rather than removing it. /pnpm-lock.yaml is watched
# unconditionally, and every dependency bump anywhere in the monorepo rewrites
# that file, so those still redeploy this service even though `turbo prune`
# produces a byte-identical context. Dropping it is worse: a turbo or typescript
# bump does change the image, and watchPatterns cannot express "only if the
# pruned lockfile changed".
#
# It has to name every root file that changes this image, not just the app's own
# directory: a pattern missing here means the image silently goes stale instead
# of rebuilding. It stays correct only while this package has no workspace
# dependencies; the first one means adding /packages/** too.
#
# package.json carries the root devDependencies and the packageManager field the
# pruner and installer stages both pin against, and .dockerignore decides what
# the build context contains at all - a change to either produces a different
# image from identical app sources.
#
# The negations are the same argument from the other side: docs and tests do not
# reach the image - tsconfig.json excludes tests from emit - so without them,
# editing this README or a test file redeploys the service and fires an
# announcement run off schedule.
#
# This file is deliberately NOT negated. It does not change the image either, but
# it carries cronSchedule and restartPolicyType, and only a redeploy applies
# those. Excluded, a schedule change would sit committed and inert until some
# unrelated watched file happened to move.
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/release-bot/Dockerfile"
watchPatterns = [
  "/apps/release-bot/**",
  "!/apps/release-bot/README.md",
  "!/apps/release-bot/.env.example",
  "!/apps/release-bot/src/__tests__/**",
  "!/apps/release-bot/vitest.config.ts",
  "!/apps/release-bot/tsconfig.test.json",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/.npmrc",
  "/tsconfig.json",
  "/turbo.json",
  "/.dockerignore",
]

[deploy]
restartPolicyType = "NEVER"
# Hourly, so a release or video is posted within the hour rather than up to a
# day late. A run with nothing new to post almost never calls OpenAI; it reads
# channel history back 30 days (usually one page), the latest releases per
# source, and one YouTube API request when the key is set.
#
# Runs normally take seconds. Railway does not start a scheduled run while the
# previous one is still active, so scheduled runs never overlap. Railway's
# minimum interval is 5 minutes; hourly is a choice about cost and noise, not a
# safety limit. See the README's Schedule section.
cronSchedule = "0 * * * *"
