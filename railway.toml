# Railway configuration — outpost-web (root / default config)
# https://docs.railway.com/reference/config-as-code
#
# Railway config-as-code is SINGLE-SERVICE per file (top-level [build]/[deploy]).
# There is NO [services.<name>] multi-service syntax. The previous version of this
# file used [services.*] blocks, which Railway silently IGNORED — every service then
# fell back to the auto-detect (Railpack) builder and failed to build with
# "No start command detected".
#
# Monorepo layout — each service has its own single-service config file:
#   outpost-web         -> railway.toml            (this file, the default root config)
#   outpost-discord-bot -> apps/discord-bot/railway.toml
#   outpost-github-app  -> apps/github-app/railway.toml
#   outpost-slack-bot   -> apps/slack-bot/railway.toml
#   outpost-teams-bot   -> apps/teams-bot/railway.toml
#   outpost-linear-sync -> apps/linear-sync/railway.toml
#   outpost-worker      -> apps/worker/railway.toml
#   outpost-release-bot -> apps/release-bot/railway.toml
#
# Each non-web service must point its "Config file path" (Railway dashboard ->
# service -> Settings -> Config-as-code) at its file above. Build context is the
# repo ROOT for every service (the Dockerfiles run `turbo prune`), so leave each
# service's Root Directory empty.
#
# NOTE: web's [deploy] settings (healthcheck, etc.) stay managed in the Railway
# dashboard and are intentionally NOT overridden here, to avoid changing the live
# service. Add a [deploy] section if/when you want them version-controlled
# (web's health endpoint is /api/health).

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"
